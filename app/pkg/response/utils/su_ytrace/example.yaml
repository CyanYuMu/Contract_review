# su_ytrace 配置示例
#
# service_name 说明：
#   - 这是整个服务的名称，会显示在 Jaeger/Tempo 中作为服务标识
#   - 建议使用项目名称，如 "seaart-api", "seaart-worker" 等
#   - 各个组件（DB、Redis、MongoDB等）会自动使用独立的 tracer name，
#     格式为 "seago/utils/db", "seago/utils/cache" 等

# ==========================================
# 本地开发环境配置 (Jaeger)
# ==========================================
enabled: true
service_name: "seaart-api"  # 使用实际的服务名称
exporter: "jaeger"

jaeger:
  endpoint: "http://localhost:14268/api/traces"

sampling:
  ratio: 1.0  # 100% 采样，开发环境全量追踪

# ==========================================
# 测试环境配置 (Jaeger)
# ==========================================
# enabled: true
# service_name: "seaart-api"  # 跨环境使用相同服务名，便于对比
# exporter: "jaeger"
#
# jaeger:
#   endpoint: "http://jaeger-test.internal:14268/api/traces"
#
# sampling:
#   ratio: 1.0

# ==========================================
# 生产环境配置 (OTLP/Tempo)
# ==========================================
# enabled: true
# service_name: "seaart-api"  # 生产环境服务名
# exporter: "otlp"
#
# otlp:
#   endpoint: "otel-collector-gateway-collector.olte.svc.cluster.local:4317"
#   insecure: false
#   timeout: 10s
#
# sampling:
#   ratio: 0.1  # 10% 采样率，降低性能影响

# ==========================================
# Worker 服务示例
# ==========================================
# enabled: true
# service_name: "seaart-worker"  # Worker 服务使用不同的服务名
# exporter: "otlp"
#
# otlp:
#   endpoint: "otel-collector-gateway-collector.olte.svc.cluster.local:4317"
#   insecure: false
#   timeout: 10s
#
# sampling:
#   ratio: 1.0

# ==========================================
# 调试模式 (Stdout)
# ==========================================
# enabled: true
# service_name: "seaart-api"
# exporter: "stdout"
#
# sampling:
#   ratio: 1.0

# ==========================================
# 关闭追踪
# ==========================================
# enabled: false
